<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GT Coach - KittenTTS Benchmark</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e1e4ea;
      min-height: 100vh;
    }
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    nav {
      margin-bottom: 16px;
      font-size: 13px;
    }
    nav a {
      color: #6366f1;
      text-decoration: none;
    }
    nav a:hover { text-decoration: underline; }
    .top-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .top-bar h1 {
      font-size: 22px;
      font-weight: 650;
      color: #fff;
      letter-spacing: 0;
    }
    .top-bar p {
      font-size: 13px;
      color: #8b8fa3;
      margin-top: 4px;
      line-height: 1.5;
      max-width: 720px;
    }
    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }
    .btn {
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s, background 0.15s;
    }
    .btn:hover:not(:disabled) { opacity: 0.86; }
    .btn:disabled { opacity: 0.42; cursor: not-allowed; }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-secondary { background: #2a2d3a; color: #e1e4ea; }
    .btn-sm {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 6px;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }
    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
      .actions { width: 100%; }
      .actions .btn { flex: 1; }
    }
    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .card h2 {
      font-size: 12px;
      font-weight: 650;
      color: #8b8df8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .field {
      margin-bottom: 14px;
    }
    .field:last-child { margin-bottom: 0; }
    label,
    .field-label {
      display: block;
      color: #8b8fa3;
      font-size: 12px;
      font-weight: 650;
      margin-bottom: 6px;
    }
    select,
    textarea,
    input[type="number"] {
      width: 100%;
      background: #0f1117;
      border: 1px solid #343849;
      color: #e1e4ea;
      border-radius: 8px;
      padding: 9px 10px;
      font: inherit;
      font-size: 13px;
    }
    textarea {
      min-height: 104px;
      resize: vertical;
      line-height: 1.45;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #6366f1;
    }
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .model-list {
      display: grid;
      gap: 8px;
    }
    .model-choice {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: start;
      padding: 10px;
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 8px;
    }
    .model-choice input {
      margin-top: 3px;
      accent-color: #6366f1;
    }
    .model-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      font-weight: 650;
      color: #fff;
    }
    .model-meta {
      font-size: 12px;
      color: #8b8fa3;
      line-height: 1.4;
      margin-top: 2px;
    }
    .inline-check {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #e1e4ea;
      font-size: 13px;
      font-weight: 500;
    }
    .inline-check input { accent-color: #6366f1; }
    .status-banner {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 650;
      margin-bottom: 12px;
      background: rgba(96,165,250,0.1);
      border: 1px solid rgba(96,165,250,0.25);
      color: #60a5fa;
    }
    .status-banner.visible { display: block; }
    .status-banner.error {
      background: rgba(248,113,113,0.1);
      border-color: rgba(248,113,113,0.3);
      color: #f87171;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    @media (max-width: 720px) {
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .split { grid-template-columns: 1fr; }
    }
    .summary-stat {
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 8px;
      padding: 12px;
      min-height: 74px;
    }
    .summary-stat .number {
      color: #fff;
      font-size: 22px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }
    .summary-stat .label {
      color: #8b8fa3;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 700px;
    }
    th,
    td {
      padding: 9px 10px;
      border-bottom: 1px solid #2a2d3a;
      text-align: right;
      vertical-align: middle;
    }
    th {
      color: #8b8fa3;
      font-weight: 650;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    th:first-child,
    td:first-child { text-align: left; }
    td {
      color: #e1e4ea;
      font-variant-numeric: tabular-nums;
    }
    .muted { color: #777b8f; }
    .good { color: #4ade80; }
    .warn { color: #fbbf24; }
    .bad { color: #f87171; }
    .empty-state {
      color: #777b8f;
      font-size: 13px;
      line-height: 1.5;
      padding: 20px 0 4px;
    }
    .row-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-start;
      margin-top: 8px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <nav><a href="/">Voice Test</a> / KittenTTS Benchmark</nav>

    <div class="top-bar">
      <div>
        <h1>KittenTTS Benchmark</h1>
        <p>Local Node CPU comparison for Kitten Micro, Nano fp32, and Nano int8 using GT Coach messages.</p>
      </div>
      <div class="actions">
        <button class="btn btn-secondary" id="clear-btn" disabled>Clear</button>
        <button class="btn btn-primary" id="run-btn" disabled>Generate</button>
      </div>
    </div>

    <div class="grid">
      <div>
        <div class="card">
          <h2>Models</h2>
          <div class="model-list" id="model-list"></div>
        </div>

        <div class="card">
          <h2>Voice</h2>
          <div class="split">
            <div class="field">
              <label for="voice-select">Voice</label>
              <select id="voice-select"></select>
            </div>
            <div class="field">
              <label for="threads-select">Threads</label>
              <select id="threads-select"></select>
            </div>
          </div>
          <div class="field">
            <label for="speed-slider">Speed <span id="speed-value">1.0x</span></label>
            <input type="range" id="speed-slider" min="0.5" max="2.0" step="0.1" value="1.0">
          </div>
          <label class="inline-check">
            <input type="checkbox" id="clean-toggle" checked>
            Clean text
          </label>
        </div>

        <div class="card">
          <h2>Message</h2>
          <div class="field">
            <label for="message-select">Preset</label>
            <select id="message-select"></select>
          </div>
          <div class="field">
            <label for="text-input">Text</label>
            <textarea id="text-input"></textarea>
          </div>
        </div>
      </div>

      <div>
        <div class="status-banner" id="status-banner"></div>

        <div class="card hidden" id="summary-card">
          <h2>Summary</h2>
          <div class="summary-grid" id="summary-grid"></div>
        </div>

        <div class="card">
          <h2>Results</h2>
          <div class="table-wrap hidden" id="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Model</th>
                  <th>Status</th>
                  <th>Load</th>
                  <th>Generation</th>
                  <th>Audio</th>
                  <th>RTF</th>
                  <th>RMS</th>
                </tr>
              </thead>
              <tbody id="results-body"></tbody>
            </table>
          </div>
          <div class="empty-state" id="empty-state">Select models and generate a sample.</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const state = {
      config: null,
      rows: new Map(),
      audio: new Map(),
      audioContext: null,
    };

    function setStatus(message, kind = 'info') {
      const banner = $('status-banner');
      banner.textContent = message;
      banner.className = `status-banner visible${kind === 'error' ? ' error' : ''}`;
    }

    function clearStatus() {
      $('status-banner').className = 'status-banner';
      $('status-banner').textContent = '';
    }

    function fmtMs(ms) {
      if (!Number.isFinite(ms)) return '-';
      return ms < 1000 ? `${Math.round(ms)}ms` : `${(ms / 1000).toFixed(1)}s`;
    }

    function fmtDuration(seconds) {
      if (!Number.isFinite(seconds)) return '-';
      return `${seconds.toFixed(2)}s`;
    }

    function selectedModels() {
      return [...document.querySelectorAll('[data-model-checkbox]:checked')]
        .map((input) => state.config.models.find((model) => model.modelId === input.value))
        .filter(Boolean);
    }

    function renderModels(models) {
      $('model-list').innerHTML = models.map((model) => `
        <label class="model-choice">
          <input type="checkbox" data-model-checkbox value="${model.modelId}" checked>
          <span>
            <span class="model-title">
              <span>${model.label}</span>
              <span class="muted">${model.size}</span>
            </span>
            <span class="model-meta">${model.role}${model.note ? ` - ${model.note}` : ''}</span>
          </span>
        </label>
      `).join('');
    }

    function renderOptions(config) {
      renderModels(config.models);

      $('voice-select').innerHTML = config.voices.map((voice) => (
        `<option value="${voice.id}" ${voice.id === 'Leo' ? 'selected' : ''}>${voice.label} (${voice.gender})</option>`
      )).join('');

      $('threads-select').innerHTML = config.threads.map((threads) => (
        `<option value="${threads.value}" ${threads.value === '2' ? 'selected' : ''}>${threads.label}</option>`
      )).join('');

      $('speed-slider').min = config.speed.min;
      $('speed-slider').max = config.speed.max;
      $('speed-slider').step = config.speed.step;
      $('speed-slider').value = config.speed.default;
      $('speed-value').textContent = `${Number(config.speed.default).toFixed(1)}x`;

      $('message-select').innerHTML = [
        `<option value="custom">Custom</option>`,
        ...config.messages.map((message) => (
          `<option value="${message.id}">${message.cascade}: ${message.text}</option>`
        )),
      ].join('');
      $('text-input').value = config.defaultText;
    }

    function rowTemplate(id, model, status = 'Queued') {
      return `
        <tr data-row-id="${id}">
          <td>
            <strong>${model.label}</strong><br>
            <span class="muted">${model.modelId}</span>
            <div class="row-actions">
              <button class="btn btn-secondary btn-sm" data-action="play" data-id="${id}" disabled>Play</button>
              <button class="btn btn-secondary btn-sm" data-action="download" data-id="${id}" disabled>WAV</button>
            </div>
          </td>
          <td data-cell="status">${status}</td>
          <td data-cell="load">-</td>
          <td data-cell="gen">-</td>
          <td data-cell="duration">-</td>
          <td data-cell="rtf">-</td>
          <td data-cell="rms">-</td>
        </tr>
      `;
    }

    function setCell(id, name, value, className = '') {
      const row = state.rows.get(id);
      if (!row) return;
      const cell = row.querySelector(`[data-cell="${name}"]`);
      if (!cell) return;
      cell.textContent = value;
      cell.className = className;
    }

    function setActionsEnabled(id, enabled) {
      const row = state.rows.get(id);
      if (!row) return;
      row.querySelectorAll('button[data-action]').forEach((button) => {
        button.disabled = !enabled;
      });
    }

    function rtfClass(value) {
      if (value >= 2) return 'good';
      if (value >= 1) return 'warn';
      return 'bad';
    }

    function decodeFloat32(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new Float32Array(bytes.buffer);
    }

    function encodeWav(samples, sampleRate) {
      const dataSize = samples.length * 2;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      function writeString(offset, value) {
        for (let i = 0; i < value.length; i++) {
          view.setUint8(offset + i, value.charCodeAt(i));
        }
      }

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (const sample of samples) {
        const clamped = Math.max(-1, Math.min(1, sample));
        view.setInt16(offset, clamped < 0 ? clamped * 0x8000 : clamped * 0x7fff, true);
        offset += 2;
      }

      return buffer;
    }

    async function playAudio(id) {
      const item = state.audio.get(id);
      if (!item) return;
      state.audioContext ??= new AudioContext({ sampleRate: item.sampleRate });
      if (state.audioContext.state === 'suspended') {
        await state.audioContext.resume();
      }
      const audioBuffer = state.audioContext.createBuffer(1, item.samples.length, item.sampleRate);
      audioBuffer.copyToChannel(item.samples, 0);
      const source = state.audioContext.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(state.audioContext.destination);
      source.start();
    }

    function downloadAudio(id) {
      const item = state.audio.get(id);
      if (!item) return;
      const wav = encodeWav(item.samples, item.sampleRate);
      const blob = new Blob([wav], { type: 'audio/wav' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${item.fileBase}.wav`;
      link.click();
      URL.revokeObjectURL(url);
    }

    function renderSummary(results) {
      if (results.length === 0) {
        $('summary-card').classList.add('hidden');
        return;
      }

      const fastest = [...results].sort((a, b) => b.rtf - a.rtf)[0];
      const avgRtf = results.reduce((sum, item) => sum + item.rtf, 0) / results.length;
      const avgGen = results.reduce((sum, item) => sum + item.genTimeMs, 0) / results.length;
      const cached = results.filter((item) => item.model.cached).length;

      $('summary-grid').innerHTML = `
        <div class="summary-stat">
          <div class="number">${results.length}</div>
          <div class="label">Generated</div>
        </div>
        <div class="summary-stat">
          <div class="number">${avgRtf.toFixed(2)}x</div>
          <div class="label">Average RTF</div>
        </div>
        <div class="summary-stat">
          <div class="number">${fmtMs(avgGen)}</div>
          <div class="label">Average Generate</div>
        </div>
        <div class="summary-stat">
          <div class="number">${fastest.model.label}</div>
          <div class="label">Fastest</div>
        </div>
      `;
      $('summary-card').classList.remove('hidden');
      setStatus(`${results.length} samples ready. ${cached} model loads reused the in-memory cache.`);
    }

    async function postJson(url, body) {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const payload = await response.json();
      if (!response.ok || payload.error) {
        throw new Error(payload.error || `HTTP ${response.status}`);
      }
      return payload;
    }

    async function runBenchmark() {
      const models = selectedModels();
      if (models.length === 0) {
        setStatus('Select at least one model.', 'error');
        return;
      }

      const text = $('text-input').value.trim();
      if (!text) {
        setStatus('Enter text to synthesize.', 'error');
        return;
      }

      clearStatus();
      $('run-btn').disabled = true;
      $('clear-btn').disabled = true;
      $('empty-state').classList.add('hidden');
      $('table-wrap').classList.remove('hidden');
      $('results-body').innerHTML = models.map((model) => rowTemplate(model.id, model)).join('');
      state.rows = new Map([...document.querySelectorAll('[data-row-id]')].map((row) => [row.dataset.rowId, row]));
      state.audio.clear();
      const results = [];

      const common = {
        voice: $('voice-select').value,
        text,
        speed: Number($('speed-slider').value),
        clean: $('clean-toggle').checked,
        numThreads: $('threads-select').value,
      };

      for (const model of models) {
        setCell(model.id, 'status', 'Loading', 'warn');
        setStatus(`Generating ${model.label}...`);
        try {
          const result = await postJson('/api/kitten/generate', {
            ...common,
            modelId: model.modelId,
          });
          const samples = decodeFloat32(result.audio);
          state.audio.set(model.id, {
            samples,
            sampleRate: result.sampleRate,
            fileBase: `kitten-${model.id}-${common.voice}-${Date.now()}`,
          });
          setCell(model.id, 'status', result.model.cached ? 'Cached' : 'Ready', 'good');
          setCell(model.id, 'load', result.model.cached ? 'cached' : fmtMs(result.model.loadMs));
          setCell(model.id, 'gen', fmtMs(result.genTimeMs));
          setCell(model.id, 'duration', fmtDuration(result.audioDurationSec));
          setCell(model.id, 'rtf', `${result.rtf.toFixed(2)}x`, rtfClass(result.rtf));
          setCell(model.id, 'rms', result.rms.toFixed(6));
          setActionsEnabled(model.id, true);
          results.push(result);
        } catch (error) {
          setCell(model.id, 'status', error.message, 'bad');
        }
      }

      renderSummary(results);
      if (results.length === 0) {
        setStatus('No samples were generated.', 'error');
      }
      $('run-btn').disabled = false;
      $('clear-btn').disabled = false;
    }

    function clearResults() {
      state.audio.clear();
      state.rows.clear();
      $('results-body').innerHTML = '';
      $('table-wrap').classList.add('hidden');
      $('empty-state').classList.remove('hidden');
      $('summary-card').classList.add('hidden');
      $('clear-btn').disabled = true;
      clearStatus();
    }

    async function init() {
      try {
        const response = await fetch('/api/kitten/config');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        state.config = await response.json();
        renderOptions(state.config);
        $('run-btn').disabled = false;
      } catch (error) {
        setStatus(`Could not load Kitten config: ${error.message}`, 'error');
      }
    }

    $('speed-slider').addEventListener('input', () => {
      $('speed-value').textContent = `${Number($('speed-slider').value).toFixed(1)}x`;
    });

    $('message-select').addEventListener('change', () => {
      const id = $('message-select').value;
      if (id === 'custom') return;
      const message = state.config?.messages.find((item) => item.id === id);
      if (message) $('text-input').value = message.text;
    });

    $('text-input').addEventListener('input', () => {
      $('message-select').value = 'custom';
    });

    $('run-btn').addEventListener('click', runBenchmark);
    $('clear-btn').addEventListener('click', clearResults);
    $('results-body').addEventListener('click', (event) => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      if (button.dataset.action === 'play') playAudio(button.dataset.id);
      if (button.dataset.action === 'download') downloadAudio(button.dataset.id);
    });

    init();
  </script>
</body>
</html>
